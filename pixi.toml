[workspace]
authors = ["Liang Liu <liangliu@fnal.gov>"]
channels = ["conda-forge"]
name = "genie-dev"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.14.*"
jq = ">=1.8.1,<2"

# Build-time only: shared/build_pdg.py uses the PDG API to validate GENIE
# codes and enrich shared/pdg.json. Runtime (lib/pdg.py) reads the JSON only.
[pypi-dependencies]
pdg = "*"
